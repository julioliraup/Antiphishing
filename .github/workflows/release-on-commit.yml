name: Release on Commit

on:
  push:
    branches: [ main ]

jobs:
  create-release:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Get rule counts
        id: counts
        run: |
          # Read last SID from tracker (assumed to be the total number of SIDs allocated)
          if [ -f sid_tracker.txt ]; then
            SID=$(cat sid_tracker.txt)
          else
            echo "sid_tracker.txt not found, defaulting SID to 0"
            SID=0
          fi
          # HTTP rules count is total SIDs minus the two DNS/TLS rules
          HTTP=$((SID - 2))
          # Count number of lines in phishing.lst (each line represents a vector)
          if [ -f phishing.lst ]; then
            LINES=$(wc -l < phishing.lst)
          else
            echo "phishing.lst not found, defaulting line count to 0"
            LINES=0
          fi
          # Count number of suspicious NRD domains analyzed
          if [ -f nrd_suspicious_domains.txt ]; then
            NRD=$(grep -c -v '^[[:space:]]*$' nrd_suspicious_domains.txt || echo 0)
          else
            echo "nrd_suspicious_domains.txt not found, defaulting NRD count to 0"
            NRD=0
          fi
          TLS=$LINES
          DNS=$LINES
          echo "http=$HTTP" >> $GITHUB_OUTPUT
          echo "tls=$TLS" >> $GITHUB_OUTPUT
          echo "dns=$DNS" >> $GITHUB_OUTPUT
          echo "vectors=$LINES" >> $GITHUB_OUTPUT
          echo "nrd=$NRD" >> $GITHUB_OUTPUT
      - name: Compute total rule count
        id: total
        run: |
          echo "total=$(( ${{ steps.counts.outputs.http }} + ${{ steps.counts.outputs.tls }} + ${{ steps.counts.outputs.dns }} ))" >> $GITHUB_OUTPUT

      
      - name: Set release timestamp
        id: timestamp
        run: |
          echo "time=$(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "release-${{ github.run_id }}"
          name: "Release ${{ steps.timestamp.outputs.time }}"
          files: |
            antiphishing.tar.gz
            antiphishing.rules
            antiphishing.rules.md5
            nrd_suspicious_domains.txt
          body: |
            | Rule / Intel Type | Count | Documentation |
            |---|---|---|
            | HTTP Rules | ${{ steps.counts.outputs.http }} | [HTTP Keywords](https://docs.suricata.io/en/latest/rules/http-keywords.html) |
            | TLS Rules | ${{ steps.counts.outputs.tls }} | [SSL/TLS Keywords](https://docs.suricata.io/en/latest/rules/tls-keywords.html) |
            | DNS Rules | ${{ steps.counts.outputs.dns }} | [DNS Keywords](https://docs.suricata.io/en/latest/rules/dns-keywords.html) |
            | Suspicious NRD Domains | ${{ steps.counts.outputs.nrd }} | [NRD Intelligence](#-newly-registered-domains-nrd-threat-intelligence) |
            | **TOTAL SURICATA RULES** | **${{ steps.total.outputs.total }}** | |

            **Total Malicious Vectors (Base64 Dataset):** ${{ steps.counts.outputs.vectors }}  
            **Total Suspicious NRD Domains Identified:** ${{ steps.counts.outputs.nrd }}

            ![Antiphishing logo](img/antiphishing.png)

            ![GitHub commit activity](https://img.shields.io/github/commit-activity/w/julioliraup/Antiphishing) ![GitHub commit activity](https://img.shields.io/github/commit-activity/t/julioliraup/Antiphishing)

            [ [DONATE](./FUNDING.md) - [DASHBOARD VECTORS](https://julioliraup.github.io/AT) - [CONTRIBUTING](./CONTRIBUTING.md) - [SUBMIT A VECTOR](/julioliraup/Antiphishing/issues/new?q=state%3Aopen+label%3A%22Phishing+Vector%22) - [REST API CTI](https://github.com/julioliraup/AT/wiki/REST-API-USE) - [WIKI](/julioliraup/Antiphishing/wiki) ]

            > Protect against phishing attacks

            # 🛡️ Newly Registered Domains (NRD) Threat Intelligence

            Our automated pipeline performs continuous analysis on Newly Registered Domains (NRDs), combining **dnstwist** domain fuzzing permutations with multi-language keyword inspection (covering top global brands across banking, e-commerce, cloud, and social media).

            ### 🚀 How to Maximize the Value of NRD Intelligence:
            - **Preemptive Proactive Defense:** Threat actors routinely register domains days or weeks before launching phishing campaigns. Identifying suspicious NRDs early blocks attack vectors *before* emails or links hit target users.
            - **Native Suricata Integration:** All identified NRD suspicious domains are automatically converted into Base64 indicators and compiled into `phishing.lst`, giving immediate coverage for both DNS and TLS/SNI traffic.
            - **Direct CTI Feed Consumption:** Security teams can directly ingest `nrd_suspicious_domains.txt` into SIEMs, SOAR playbooks, firewalls, or DNS sinkholes (e.g. Pi-hole, Unbound, AdGuard) for zero-day domain blocking.

            # Functionality

            This rule is built using malicious URLs and domains involved in phishing attacks. We utilize some community APIs to construct these rules, and with them, we create TLS, DNS, and HTTP rules.

            Our sources:
            1. [Phishstats](https://phishstats.info)
            2. [Openphish](https://openphish.com/)
            3. [cbuijs NRD Feed](https://github.com/cbuijs/nrd) (Analyzed via dnstwist & brand keyword engine)

            Contribution: [CONTRIBUTING.md](https://github.com/julioliraup/Antiphishing/blob/main/CONTRIBUTING.md)

            ![Antiphishing video](https://github.com/user-attachments/assets/32c89d48-f88c-4983-86ff-a17b8d6dcbd9)
            
            # General info
            The ruleset is the `antiphishing.rules` file, which contains two rules (TLS, DNS) that depend on a `phishing.lst` list. Finally, there is another file named `antiphishing.rules.md5` for integrity verification. We provide a compressed file containing these mentioned files, which are constantly updated without changing the URL (tar.gz):

            ```
            https://github.com/julioliraup/Antiphishing/raw/refs/heads/main/antiphishing.tar.gz
            ```
            Dot rules file:

            ```
            https://github.com/julioliraup/Antiphishing/raw/refs/heads/main/antiphishing.rules
            ```

            Suspicious NRD List:

            ```
            https://github.com/julioliraup/Antiphishing/raw/refs/heads/main/nrd_suspicious_domains.txt
            ```
      
      # --- BEGIN: Submit newly-added NRD domains as an OTX Pulse (append as last steps) ---
      - name: Extract newly added NRD domains
        id: new_nrd
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          # fallback -> whole file (initial push or missing before)
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            if [ -f nrd_suspicious_domains.txt ]; then
              grep -v '^[[:space:]]*$' nrd_suspicious_domains.txt > /tmp/added_domains.txt || true
            else
              : > /tmp/added_domains.txt
            fi
          else
            # extract only added (+) lines for the file between BEFORE and AFTER
            git fetch --no-tags --prune --depth=1 origin "$AFTER" >/dev/null 2>&1 || true
            git diff --no-prefix --unified=0 "$BEFORE" "$AFTER" -- nrd_suspicious_domains.txt \
              | awk '/^\+[^+]/ {print substr($0,2)}' \
              | sed '/^[[:space:]]*$/d' > /tmp/added_domains.txt || true
          fi

          # ensure a predictable JSON output (array of domains)
          if [ ! -s /tmp/added_domains.txt ]; then
            echo "domains=[]" >> $GITHUB_OUTPUT
          else
            # compact JSON array (single line)
            DOMS=$(python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))' < /tmp/added_domains.txt)
            echo "domains=$DOMS" >> $GITHUB_OUTPUT
          fi

      - name: Build OTX indicators from extracted NRD domains
        id: build_indicators
        run: |
          set -euo pipefail
          # read domains array (string) from previous step
          DOMS_RAW='${{ steps.new_nrd.outputs.domains }}'
          if [ "$DOMS_RAW" = '[]' ] || [ -z "$DOMS_RAW" ]; then
            echo "indicators=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          # write the indicators JSON (compact) by iterating domains
          python3 - <<'PY' > /tmp/indicators.json
import json,sys
domains = json.loads(sys.argv[1])
out = []
for d in domains:
    out.append({
        "indicator": d,
        "type": "domain",
        "title": f"Suspicious NRD domain: {d}",
        "description": (
            "Detected by the Antiphishing NRD pipeline and added to the project's NRD list. "
            "Newly Registered Domains (NRDs) are observed shortly after registration and can be used by attackers "
            "for phishing, typosquatting, or short-lived infrastructure. "
            "Reference: https://julioliraup.github.io/AT. "
            "MITRE ATT&CK mapping: T1566 (Phishing). "
            "Note: automated NRD detection can produce false positives; validate before enforcement."
        ),
        "role": "suspicious_domain"
    })
print(json.dumps(out, separators=(',',':')))
PY
          # pass the domains array as a single arg to that python snippet
          python3 - "$DOMS_RAW" > /tmp/indicators.json

          INDICATORS=$(cat /tmp/indicators.json)
          echo "indicators=$INDICATORS" >> $GITHUB_OUTPUT

      - name: Submit NRD Pulse to OTX
        if: ${{ steps.new_nrd.outputs.domains != '[]' && steps.new_nrd.outputs.domains != '' }}
        uses: julioliraup/otx-pulse@v1
        with:
          otx-api-key: ${{ secrets.OTX_API_KEY }}
          name: "Antiphishing NRD Pulse - release-${{ github.run_id }}"
          description: |
            Newly Registered Domains (NRDs) extracted from this release. These domains were added to the project's
            NRD list and are shared for community triage and situational awareness.

            Concept: Newly Registered Domains (NRDs) are domains observed shortly after registration. Attackers
            often pre-stage infrastructure via NRDs for phishing, typosquatting, or credential-harvesting sites.
            This pulse contains domains flagged by the Antiphishing pipeline and the Antiphishing Panel:
            https://julioliraup.github.io/AT

            MITRE ATT&CK mapping: T1566 (Phishing).

            Important: NRD detection is heuristic and can produce false positives (legitimate new registrations).
            Validate indicators before blocking or enforcement.
          public: 'false'
          tlp: 'amber'
          tags: 'nrd,phishing,antiphishing,mitre:T1566'
          references: 'https://julioliraup.github.io/AT'
          attack-ids: 'T1566'
          indicators: ${{ steps.build_indicators.outputs.indicators }}
      # --- END: Submit newly-added NRD domains as an OTX Pulse ---
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
