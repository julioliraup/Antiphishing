name: Release on Commit

on:
  push:
    branches: [ main ]

jobs:
  create-release:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Get intelligence and rule counts
        id: counts
        shell: bash
        run: |
          # Read the SID tracker.
          # The tracker represents the next/last allocated SID according
          # to the Antiphishing generator's current SID allocation model.
          if [ -f sid_tracker.txt ]; then
            SID=$(tr -d '[:space:]' < sid_tracker.txt)
          else
            echo "sid_tracker.txt not found, defaulting SID to 0"
            SID=0
          fi

          # Antiphishing reserves three SIDs for dataset-backed signatures:
          # 6000000 = DNS dataset
          # 6000001 = TLS dataset
          # 6000002 = IPv4 dataset
          #
          # HTTP rule count is therefore the allocated SID count minus
          # the three reserved dataset signatures.
          HTTP=$((SID - 3))

          if [ "$HTTP" -lt 0 ]; then
            HTTP=0
          fi

          # Count domain indicators in the phishing dataset.
          #
          # Each line represents one encoded dataset entry.
          if [ -f phishing.lst ]; then
            DOMAINS=$(wc -l < phishing.lst)
          else
            echo "phishing.lst not found, defaulting domain count to 0"
            DOMAINS=0
          fi

          # Count suspicious domains generated by the NRD pipeline.
          if [ -f nrd_suspicious_domains.txt ]; then
            NRD=$(grep -c -v '^[[:space:]]*$' nrd_suspicious_domains.txt || true)
          else
            echo "nrd_suspicious_domains.txt not found, defaulting NRD count to 0"
            NRD=0
          fi

          # Count IPv4 indicators.
          if [ -f phishing_ips.lst ]; then
            IPS=$(grep -c -v '^[[:space:]]*$' phishing_ips.lst || true)
          else
            echo "phishing_ips.lst not found, defaulting IP count to 0"
            IPS=0
          fi

          # The domain dataset feeds both DNS and TLS dataset signatures.
          DNS=$DOMAINS
          TLS=$DOMAINS
          IP=$IPS

          # Export values to subsequent GitHub Actions steps.
          echo "http=$HTTP" >> "$GITHUB_OUTPUT"
          echo "tls=$TLS" >> "$GITHUB_OUTPUT"
          echo "dns=$DNS" >> "$GITHUB_OUTPUT"
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          echo "domains=$DOMAINS" >> "$GITHUB_OUTPUT"
          echo "nrd=$NRD" >> "$GITHUB_OUTPUT"

      - name: Compute total generated Suricata signatures
        id: total
        shell: bash
        run: |
          TOTAL=$(( \
            ${{ steps.counts.outputs.http }} + \
            3 \
          ))

          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Set release timestamp
        id: timestamp
        run: |
          echo "time=$(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "release-${{ github.run_id }}"
          name: "Release ${{ steps.timestamp.outputs.time }}"

          files: |
            antiphishing.rules
            antiphishing.rules.md5
            antiphishing-opnsense.rules
            nrd_suspicious_domains.txt
            phishing_ips.lst
            antiphishing.tar.gz
            antiphishing-opnsense.tar.gz

          body: |
            ![Antiphishing logo](img/antiphishing.png)

            > 🛡️ **Predictive Phishing Intelligence for Suricata — Preemptive Defense from Day Zero**

            Antiphishing converts continuously processed phishing intelligence and
            emerging-domain analysis into deployable Suricata detection content.

            ## 📊 Release Intelligence

            | Detection / Intelligence | Count | Notes |
            |---|---:|---|
            | HTTP signatures | ${{ steps.counts.outputs.http }} | Generated Suricata HTTP signatures |
            | DNS dataset indicators | ${{ steps.counts.outputs.dns }} | Domains available to the DNS dataset |
            | TLS dataset indicators | ${{ steps.counts.outputs.tls }} | Domains available to the TLS/SNI dataset |
            | IPv4 indicators | ${{ steps.counts.outputs.ip }} | Destination IPv4 intelligence |
            | Suspicious NRD domains | ${{ steps.counts.outputs.nrd }} | Candidate infrastructure identified by NRD analysis |
            | **Generated Suricata signatures** | **${{ steps.total.outputs.total }}** | HTTP signatures + dataset signatures |

            ### 🧠 What the numbers mean

            The DNS, TLS, and IPv4 figures represent **intelligence indicators
            stored in Suricata datasets**, not individual Suricata signatures.

            The domain dataset is shared by the DNS and TLS/SNI detection layers.
            Therefore, the same domain intelligence can be evaluated at different
            protocol layers without generating one conventional signature per domain.

            NRD domains are **suspicious candidates generated through automated
            analysis**. They are not equivalent to manually validated malicious IOCs
            and may require additional validation or whitelisting depending on the
            deployment.

            ## ⚡ Newly Registered Domains (NRD)

            Antiphishing continuously analyzes Newly Registered Domains (NRDs) with
            observed DNS activity.

            The pipeline combines techniques such as:

            - Typosquatting detection
            - Homoglyph detection
            - Brand impersonation analysis
            - Suspicious keyword analysis
            - Domain similarity analysis

            The objective is to identify potentially suspicious phishing
            infrastructure as early as possible.

            ### 🎯 The Day-Zero concept

            In Antiphishing, **Day Zero** describes the goal of reducing the time
            between the emergence of suspicious infrastructure and defensive action.

            It does not mean that the project detects every zero-day vulnerability,
            malware family, or previously unknown attack.

            The focus is phishing infrastructure:

            > **Identify suspicious infrastructure early and make that intelligence
            > actionable at the network layer.**

            ### ⚠️ Predictive intelligence and false positives

            NRD-derived intelligence intentionally favors early identification over
            certainty.

            Because the domains have not necessarily been independently validated as
            malicious, false positives are possible.

            Organizations using this intelligence for blocking should consider
            appropriate monitoring, validation, and whitelisting workflows.

            ## 🔎 Detection Layers

            The main `antiphishing.rules` ruleset provides:

            - **DNS** — domain intelligence through `dns.query`
            - **TLS** — domain intelligence through `tls.sni`
            - **HTTP** — application-layer phishing detection
            - **IPv4** — destination-IP intelligence

            The DNS, TLS, and IPv4 layers use Suricata's native dataset mechanism.

            ## 🔌 OPNsense

            Antiphishing is integrated into the OPNsense IDS/IPS content ecosystem.

            The OPNsense integration currently has a different compatibility profile
            from the full upstream ruleset.

            The currently distributed OPNsense-compatible ruleset prioritizes
            stability and provides the HTTP signatures together with the supported
            IPv4 intelligence path.

            External DNS/TLS datasets require additional integration work in the
            OPNsense content framework and are therefore not represented as fully
            supported in the OPNsense variant at this time.

            The upstream `antiphishing.rules` ruleset remains unchanged and
            continues to provide native DNS/TLS dataset support for environments
            where external Suricata datasets can be deployed correctly.

            ## 📦 Release Files

            ### Main Suricata distribution

            `antiphishing.tar.gz`

            Contains the upstream Antiphishing ruleset and its associated
            intelligence datasets.

            ### OPNsense distribution

            `antiphishing-opnsense.tar.gz`

            Contains the OPNsense-specific ruleset variant intended to avoid the
            external dataset-loading limitations currently being investigated.

            ### Individual intelligence files

            `phishing.lst`

            Domain dataset used by the DNS and TLS/SNI dataset signatures.

            `phishing_ips.lst`

            IPv4 intelligence dataset.

            `nrd_suspicious_domains.txt`

            Suspicious domains produced by the NRD analysis pipeline.

            ## 🌐 Sources

            Antiphishing currently incorporates intelligence from sources including:

            1. [PhishStats](https://phishstats.info)
            2. [OpenPhish](https://openphish.com/)
            3. [cbuijs/nrd](https://github.com/cbuijs/nrd)

            NRD data is further processed through the project's analysis pipeline.

            ## 🔄 Automated Updates

            The intelligence pipeline is updated approximately every **6 hours**.

            The project automatically processes new intelligence and generates
            updated detection content.

            ### SID Allocation

            Antiphishing currently operates within:

            `6000000 - 6100000`

            The range is maintained by the project to avoid internal SID collisions.

            ## 🧩 Suricata Integration

            Antiphishing is designed to integrate with:

            - Suricata IDS
            - Suricata IPS
            - `suricata-update`
            - Firewall platforms using Suricata
            - SOC and security monitoring environments

            ## 🤝 Open-Source Security Ecosystem

            Antiphishing builds on the work of the wider open-source security
            ecosystem.

            The project uses external feeds, APIs, open-source libraries, domain
            analysis tools, DNS infrastructure, Suricata, and Suricata-update.

            The project's contribution is the automation, intelligence processing,
            correlation, and conversion of this information into deployable
            detection content.

            ## 🙏 Acknowledgments

            Thank you to everyone who contributes intelligence, testing, feedback,
            code, documentation, and operational experience to Antiphishing.

            Special thanks to:

            - [@antixmars](https://github.com/antixmars)
            - [@sikysikov](https://github.com/sikysikov)
            - [@satta](https://github.com/satta)
            - [@flipper203](https://github.com/flipper203)
            - [@zoomequipd](https://github.com/zoomequipd)

            ## 💛 Support Antiphishing

            Antiphishing is maintained as independent open-source security
            infrastructure.

            Sponsorship helps fund:

            - Intelligence APIs
            - NRD processing
            - VPS infrastructure
            - Public dashboards
            - REST API infrastructure
            - Ruleset distribution
            - Continuous intelligence processing

            **GitHub Sponsors**

            https://github.com/sponsors/julioliraup

            **PIX — Brazil**

            `08650081401`

            **Beneficiary:** Júlio Lira

            ## 📚 Documentation

            - [Dashboard](https://julioliraup.github.io/AT)
            - [Wiki](https://github.com/julioliraup/Antiphishing/wiki)
            - [REST API](https://github.com/julioliraup/AT/wiki/REST-API-USE)
            - [Contributing](https://github.com/julioliraup/Antiphishing/blob/main/CONTRIBUTING.md)

            ## 🐛 Feedback and False Positives

            Security researchers and users are encouraged to report:

            - False positives
            - Incorrect indicators
            - Detection problems
            - Platform compatibility issues
            - Dataset problems
            - Performance problems

            Please include the SID, indicator, Suricata version, platform, and
            relevant logs whenever possible.

            ---

            **Antiphishing — from emerging infrastructure to actionable network defense.**

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
