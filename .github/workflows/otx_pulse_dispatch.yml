name: OTX Pulse Dispatch on Commit
on:
  push:
    branches: [ main ]

jobs:
  dispatch-pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare OTX indicators
        id: indicators
        run: |
          if [ -f nrd_suspicious_domains.txt ]; then
            # Read non-empty lines, build JSON array with 'edit' attribute and incremental id starting at 1
            INDICATORS=$(awk 'NF' nrd_suspicious_domains.txt | jq -R -s -c '{edit: (split("\n")[:-1] | to_entries | map({id: (.key + 1), indicator: .value, type: "domain"}))}')
            EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
            echo "indicators<<$EOF" >> $GITHUB_OUTPUT
            echo "$INDICATORS" >> $GITHUB_OUTPUT
            echo "$EOF" >> $GITHUB_OUTPUT
          else
            echo "indicators={\"edit\":[]}" >> $GITHUB_OUTPUT
          fi

      - name: Submit Pulse to OTX
        uses: julioliraup/otx-pulse@main
        with:
          otx-api-key: ${{ secrets.OTX_API_KEY }}
          pulse-id: "6a8edabcd739b2fde47540f1"
          indicators: ${{ steps.indicators.outputs.indicators }}
          tlp: white
